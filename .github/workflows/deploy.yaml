name: backup verification

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh/
          printf '%s\n' "$SSH_KEY" > ~/.ssh/production.key
          chmod 600 ~/.ssh/production.key
          cat > ~/.ssh/config <<END
          Host node
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/production.key
            StrictHostKeyChecking no
          END
      - name: Inspect backup without restarting it
        run: |
          ssh node 'bash -s' <<'REMOTE'
          set -euo pipefail
          docker inspect backup-clickhouse-backup-1 --format 'status={{.State.Status}} started={{.State.StartedAt}} restarts={{.RestartCount}}'
          docker inspect backup-clickhouse-backup-1 --format '{{range .Config.Env}}{{println .}}{{end}}' | awk '/^(UPLOAD_CONCURRENCY|S3_CONCURRENCY)=/'
          docker top backup-clickhouse-backup-1 -eo pid,ppid,pcpu,pmem,etime,args
          docker exec backup-clickhouse-backup-1 clickhouse-backup print-config | awk '/^[[:space:]]+(upload_concurrency|concurrency|chunk_size|retry_mode):/'
          printf 'NIC speed Mbit/s: '
          cat /sys/class/net/enp7s0/speed
          backup_pid=$(docker top backup-clickhouse-backup-1 -eo pid,args | awk '/clickhouse-backup watch/ {print $1; exit}')
          printf 'Backup TCP connections:\n'
          ss -tnp | awk -v pid="$backup_pid" 'index($0,"pid="pid",")'
          printf 'Backup file descriptors:\n'
          ls -l /proc/$backup_pid/fd | awk '/\/backup\//'
          printf 'Backup IO before:\n' 
          cat /proc/$backup_pid/io
          date -u
          cat /proc/net/dev
          sleep 10
          printf 'Backup IO after:\n'
          cat /proc/$backup_pid/io
          date -u
          cat /proc/net/dev
          REMOTE
